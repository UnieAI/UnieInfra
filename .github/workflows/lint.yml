name: Lint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect scheduler C++ changes
        id: scheduler_cpp_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/tokenspeed-lint-changed-files.txt"
          scheduler_cpp_files='^tokenspeed-scheduler/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
          scheduler_cpp_config='^tokenspeed-scheduler/(\.clang-(format|tidy)|(.*/)?CMakeLists\.txt|.*\.cmake)$'

          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          if grep -Eq \
            -e "$scheduler_cpp_files" \
            -e "$scheduler_cpp_config" \
            "$changed_files"; then
            changed=true
          else
            changed=false
          fi

          # PR lint checks only files changed by this pull request.
          if [[ "$changed" == "true" ]]; then
            pre_commit_skip=no-commit-to-branch
          else
            pre_commit_skip=no-commit-to-branch,clang-format
          fi
          {
            echo "changed=$changed"
            echo "pre_commit_skip=$pre_commit_skip"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pre-commit hook
        run: |
          python -m pip install pre-commit ruff "nanobind>=2.13.0" tokenspeed-spdlog==1.15.1
          pre-commit install

      - name: Linting
        env:
          SKIP: ${{ steps.scheduler_cpp_changes.outputs.pre_commit_skip }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"

      - name: Lint changed runtime Python with ruff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t runtime_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- python/tokenspeed/runtime \
              | grep -E '\.py$' || true
          )
          if ((${#runtime_files[@]} == 0)); then
            echo "No changed runtime Python files."
            exit 0
          fi
          python -m ruff check \
            --select F401,F841,F821,F823,F811,F541,TID251,UP035,UP006,UP007,UP045 \
            "${runtime_files[@]}"

      - name: Check release orchestration
        run: |
          python -m pip install "pytest>=9" packaging cryptography pyyaml
          python -m pytest -q test/ci_system/test_weekly_release.py

      - name: Install scheduler C++ lint tools
        if: steps.scheduler_cpp_changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cmake ninja-build

      - name: Configure scheduler compile database
        if: steps.scheduler_cpp_changes.outputs.changed == 'true'
        run: |
          cmake -S tokenspeed-scheduler -B tokenspeed-scheduler/build \
            -G Ninja \
            -DTOKENSPEED_SCHEDULER_BUILD_TESTS=ON \
            -DTOKENSPEED_SCHEDULER_BUILD_PYTHON=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Lint changed scheduler Python and file starts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t scheduler_py_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- tokenspeed-scheduler \
              | grep -E '\.py$' || true
          )
          if ((${#scheduler_py_files[@]} == 0)); then
            echo "No changed scheduler Python files."
            exit 0
          fi
          python -m ruff check "${scheduler_py_files[@]}"
          python - "${scheduler_py_files[@]}" <<'PY'
          import sys
          from pathlib import Path

          blank_starts = []
          relative_imports = []
          for name in sys.argv[1:]:
              path = Path(name)
              if path.read_bytes().startswith((b"\n", b"\r\n")):
                  blank_starts.append(name)
              for line_no, line in enumerate(path.read_text().splitlines(), 1):
                  if line.startswith(("from .", "import .")):
                      relative_imports.append(f"{name}:{line_no}: {line}")

          errors = []
          if blank_starts:
              errors.append("files must not start with a blank line:\n" + "\n".join(blank_starts))
          if relative_imports:
              errors.append("scheduler Python must use absolute imports:\n" + "\n".join(relative_imports))
          if errors:
              raise SystemExit("\n\n".join(errors))
          PY

      - name: Lint changed scheduler C++
        if: steps.scheduler_cpp_changes.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t cpp_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- tokenspeed-scheduler \
              | grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' || true
          )
          if ((${#cpp_files[@]} == 0)); then
            echo "No changed scheduler C++ files."
            exit 0
          fi
          jobs="$(nproc)"
          format_count="${#cpp_files[@]}"
          tidy_count=0
          for file in "${cpp_files[@]}"; do
            if [[ "$file" =~ \.(c|cc|cpp|cxx)$ ]]; then
              tidy_count=$((tidy_count + 1))
            fi
          done

          echo "Running clang-format on ${format_count} files with ${jobs} workers"
          printf '%s\n' "${cpp_files[@]}" | xargs -r -n 16 -P "$jobs" sh -c '
            echo "clang-format: $*"
            clang-format --dry-run --Werror "$@"
          ' sh

          echo "Running clang-tidy on ${tidy_count} translation units with ${jobs} workers"
          printf '%s\n' "${cpp_files[@]}" | grep -E '\.(c|cc|cpp|cxx)$' | xargs -r -n 1 -P "$jobs" sh -c '
            echo "clang-tidy: $1"
            clang-tidy -p tokenspeed-scheduler/build "$1"
          ' sh
