name: NVIDIA Tests
run-name: "NVIDIA GB10 Tests /ci-run ${{ inputs.pr_number || 'manual' }} @ ${{ inputs.commit || github.sha }}"

# GB10 CI is intentionally maintainer-triggered only. A maintainer comments
# `/ci-run` on a PR; ci-run.yml dispatches this workflow for the PR head SHA.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact PR head commit to test"
        required: true
        type: string
      pr_number:
        description: "PR number associated with the commit"
        required: true
        type: string
      trigger:
        description: "CI task trigger to run"
        required: false
        default: manual
        type: choice
        options:
          - manual
          - debug

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  CUDA_VERSION: 13.0.1
  TOKENSPEED_B200_RUNNER_LABEL: ${{ vars.TOKENSPEED_B200_RUNNER_LABEL || 'b200v2' }}

concurrency:
  group: pr-test-nvidia-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'high priority' && format('-ignored-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    # Run jobs for pull requests, or for push/manual events in the official
    # repository or a repository whose full name matches TOKENSPEED_CI_REPOSITORY.
    if: |
      (github.event.action != 'labeled' || github.event.label.name == 'high priority') &&
      (
        github.event_name == 'pull_request' ||
        github.repository == 'lightseekorg/tokenspeed' ||
        github.repository == 'UnieAI/UnieInfra' ||
        github.repository == vars.TOKENSPEED_CI_REPOSITORY
      )
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
      model_matrix: ${{ steps.scan.outputs.model_matrix }}
      model_has_tasks: ${{ steps.scan.outputs.model_has_tasks }}
      eager_model: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'high priority') }}
      install_tokenspeed_mla_from_source: ${{ steps.changes.outputs.install_tokenspeed_mla_from_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Install scan dependency
        # pypi.org occasionally returns "Content-Type: Unknown" for the simple
        # index, which strict pip>=22 refuses to parse. Retry a few times.
        run: |
          for i in 1 2 3 4 5; do
            python3 -m pip install pyyaml && exit 0
            echo "pyyaml install attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Classify changed paths
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/tokenspeed-changed-files.txt"
          case "${{ github.event_name }}" in
            pull_request)
              gh api \
                "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate \
                -q '.[] | .filename, (.previous_filename // empty)' \
                > "$changed_files"
              ;;
            *)
              : > "$changed_files"
              ;;
          esac
          python3 test/ci_system/ci_path_filter.py \
            --runner-group gb10 \
            --event-name "${{ github.event_name }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            "$changed_files" >> "$GITHUB_OUTPUT"

      - name: Build task matrix
        id: scan
        if: steps.changes.outputs.should_run == 'true'
        env:
          TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS: h100,b300,${{ vars.TOKENSPEED_CI_EXCLUDED_RUNNER_LABELS }}
        run: |
          # GB10 CI intentionally runs only the two Qwen model evaluations.
          matrix=$(python3 test/ci_system/pipeline.py scan \
            --root test/ci \
            --changed-files "$RUNNER_TEMP/tokenspeed-changed-files.txt" \
            --trigger "${{ inputs.trigger || 'manual' }}" \
            --runner-group "gb10" \
            --workflow-stage "model-test")
          echo "model_matrix=${matrix}" >> "$GITHUB_OUTPUT"
          printf '%s' "$matrix" | python3 -c "import json, sys; print('model_has_tasks=' + ('true' if json.load(sys.stdin).get('include') else 'false'))" >> "$GITHUB_OUTPUT"

  model-test:
    needs: scan
    if: |
      !cancelled() &&
      needs.scan.result == 'success' &&
      needs.scan.outputs.should_run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.scan.outputs.model_has_tasks == 'true'
    uses: ./.github/workflows/run-ci-task-matrix.yml
    with:
      matrix: ${{ needs.scan.outputs.model_matrix }}
      timeout_minutes: 120
      install_tokenspeed_mla_from_source: ${{ needs.scan.outputs.install_tokenspeed_mla_from_source }}
      b200_runner_label: ${{ vars.TOKENSPEED_B200_RUNNER_LABEL || 'b200v2' }}
      checkout_ref: ${{ inputs.commit || github.sha }}
    secrets: inherit

  model-test-eager:
    needs: scan
    if: |
      needs.scan.outputs.should_run == 'true' &&
      needs.scan.outputs.eager_model == 'true' &&
      github.event.pull_request.draft == false &&
      needs.scan.outputs.model_has_tasks == 'true'
    uses: ./.github/workflows/run-ci-task-matrix.yml
    with:
      matrix: ${{ needs.scan.outputs.model_matrix }}
      timeout_minutes: 120
      install_tokenspeed_mla_from_source: ${{ needs.scan.outputs.install_tokenspeed_mla_from_source }}
      b200_runner_label: ${{ vars.TOKENSPEED_B200_RUNNER_LABEL || 'b200v2' }}
      checkout_ref: ${{ inputs.commit || github.sha }}
    secrets: inherit

  finish:
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      (
        github.event_name == 'pull_request' ||
        github.repository == 'lightseekorg/tokenspeed' ||
        github.repository == 'UnieAI/UnieInfra' ||
        github.repository == vars.TOKENSPEED_CI_REPOSITORY
      ) &&
      (github.event.action != 'labeled' || github.event.label.name == 'high priority')
    needs: [model-test, model-test-eager]
    runs-on: ubuntu-latest
    steps:
      - name: Finish
        env:
          MODEL_TEST_RESULT: ${{ needs.model-test.result }}
          MODEL_TEST_EAGER_RESULT: ${{ needs.model-test-eager.result }}
        run: |
          for result in "$MODEL_TEST_RESULT" "$MODEL_TEST_EAGER_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "GB10 model tests did not finish successfully: dependency result=$result"
              exit 1
            fi
          done
          echo "GB10 model tests finished."
