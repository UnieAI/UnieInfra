default_stages: [pre-commit, pre-push, manual]

# UnieAI-local. `legacy/` is a frozen copy of the pre-restructure repository,
# kept so the old fork's divergence stays readable and re-applicable. Two
# reasons it must not be touched by the hooks:
#   - it holds unified diffs and patches (`legacy/divergence/*.diff`,
#     `legacy/patches/*.patch`). A context line in that format is " " + content,
#     so a blank context line is a single space -- exactly what
#     trailing-whitespace strips, silently corrupting the patch.
#   - reformatting an archive destroys its fidelity to what was actually run.
# `vllm_fa4` is vendored verbatim from vLLM (see its README); keeping the hooks
# off it keeps it diffable against the upstream copy.
exclude: '^(legacy/|tokenspeed-kernel/python/tokenspeed_kernel/thirdparty/vllm_fa4/)'

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
  - repo: https://github.com/pre-commit/mirrors-clang-format
    # Pin to the major version the CI lint job installs (ubuntu-latest
    # clang-format 18); other majors format differently and ping-pong.
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: ^tokenspeed-scheduler/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black-jupyter
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          - '--keep-output'
          - '--extra-keys=metadata.kernelspec metadata.language_info.version'
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: AMD ops README line length
        files: ^tokenspeed-kernel-amd/python/tokenspeed_kernel_amd/ops/README\.md$
        args:
          - --config
          - tokenspeed-kernel-amd/python/tokenspeed_kernel_amd/ops/.markdownlint.yaml
