[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unieinfra_scheduler"
version = "0.1.0"
description = "UnieInfra's SLO-aware, KV-derived admission policy as an out-of-tree vLLM scheduler."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UnieInfra contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

# Deliberately empty. `unieinfra_scheduler.policy` imports only the stdlib, and
# `unieinfra_scheduler.vllm_scheduler` is loaded by vLLM's own `--scheduler-cls`
# resolution, so vLLM is always already importable when it runs. Declaring vllm
# here would make this package a second opinion on which vLLM to install --
# the kernel plugin (`unieinfra_kernel`) deliberately does not do that either.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["unieinfra_scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
